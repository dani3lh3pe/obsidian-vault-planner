# Push a tag equal to manifest.json's version (e.g. 0.1.0, no "v": Obsidian looks the release up
# by that version) → the gate, then a GitHub release with the zip and the three plugin files.
name: release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: bash scripts/verify.sh
      - run: >
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          release/vault-planner.zip
          release/vault-planner/main.js release/vault-planner/manifest.json release/vault-planner/styles.css
        env:
          GH_TOKEN: ${{ github.token }}
